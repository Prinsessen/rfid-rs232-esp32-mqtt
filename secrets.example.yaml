# Copy to secrets.yaml (never commit it) and fill in. ESPHome reads it by the names in rfid-serial-bridge.yaml.
wifi_ssid: "your-wifi"
wifi_password: "..."
fallback_password: "..."          # the setup access point the board opens when the WiFi is gone
ota_password: "..."

mqtt_broker: "mqtt.example.org"   # a name the certificate is issued for
mqtt_username: "rfid-bridge"
mqtt_password: "..."
# The root certificate the broker's certificate chains to (PEM). Example: a Let's Encrypt chain ends at ISRG Root X1,
# a DigiCert chain often at DigiCert Global Root G2. Check yours: openssl s_client -connect <broker>:8883 -showcerts
mqtt_ca: |
  -----BEGIN CERTIFICATE-----
  ...
  -----END CERTIFICATE-----
